<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Surprise</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        overflow: hidden;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffdde1;
        flex-direction: column;
        text-align: center;
    }

    #intro, #container, #message {
        position: absolute;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        top: 0;
        left: 0;
        height: 100vh;
        transition: opacity 1s ease;
    }

    #intro {
        background: linear-gradient(135deg,#ff9a9e,#fad0c4);
        font-size: 2rem;
        color: white;
        z-index: 3;
    }

    #intro span {
        font-size: 2.5rem;
        margin-top: 20px;
    }

    #container h1 {
        font-size: 3rem;
        margin-bottom: 30px;
    }

    button {
        font-size: 1.5rem;
        padding: 12px 30px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        margin: 10px;
        transition: transform 0.2s ease;
    }

    #yes {
        background: #4CAF50;
        color: white;
    }

    #no {
        background: #f44336;
        color: white;
    }

    .heart, .flower, .confetti {
        position: absolute;
        font-size: 20px;
        opacity: 0.8;
    }

    .heart {
        bottom: -20px;
        animation: floatUp 6s linear forwards;
    }

    .flower {
        bottom: -20px;
        animation: floatUp 7s linear forwards;
    }

    .confetti {
        animation: floatUp 2s linear forwards;
    }

    @keyframes floatUp {
        from { transform: translateY(0); opacity: 0.8; }
        to { transform: translateY(-110vh); opacity: 0; }
    }
</style>
</head>
<body>

<!-- INTRO SCREEN -->
<div id="intro">
    Made this just for my love, Mika ❤️
    <span>💐🌸💐</span>
</div>

<!-- MAIN VALENTINE QUESTION -->
<div id="container" style="opacity:0;">
    <h1>Will you be my Valentine? ❤️</h1>
    <button id="yes">Yes</button>
    <button id="no">No</button>
</div>

<script>
const intro = document.getElementById("intro");
const container = document.getElementById("container");
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

let noClicks = 0;
let yesScale = 1;
let converted = false;

// HEARTS
function spawnHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}
setInterval(spawnHeart, 1000);

// FLOWERS
function spawnFlower() {
    const flower = document.createElement("div");
    flower.className = "flower";
    const flowers = ["💐","🌸"];
    flower.innerText = flowers[Math.floor(Math.random()*flowers.length)];
    flower.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(flower);
    setTimeout(() => flower.remove(), 7000);
}
setInterval(spawnFlower, 800);

// Intro screen timer
setTimeout(() => {
    intro.style.opacity = 0;
    setTimeout(() => { intro.style.display = "none"; }, 1000);
    container.style.opacity = 1;
}, 5000);

// NO CLICK LOGIC
noBtn.addEventListener("click", () => {
    if (converted) return;
    noClicks++;
    yesScale += 0.15;
    yesBtn.style.transform = `scale(${yesScale})`;
    if (noClicks === 10) {
        converted = true;
        noBtn.innerText = "Yes";
        noBtn.style.background = "#4CAF50";
        noBtn.addEventListener("click", finalYes);
    }
});

// YES CLICK
yesBtn.addEventListener("click", finalYes);

function finalYes() {
    // Confetti explosion
    for (let i = 0; i < 100; i++) {
        const conf = document.createElement("div");
        conf.className = "confetti";
        const confetti = ["🎉","✨","💖","💘"];
        conf.innerText = confetti[Math.floor(Math.random()*confetti.length)];
        conf.style.left = Math.random()*100 + "vw";
        conf.style.top = Math.random()*100 + "vh";
        conf.style.fontSize = (10 + Math.random()*20) + "px";
        document.body.appendChild(conf);
        setTimeout(()=>conf.remove(),2000);
    }

    // First mini message
    container.innerHTML = `<h1>hehe, I knew you would say yes 😝</h1>`;

    setTimeout(() => {
        // Final quote
        document.body.innerHTML = `
            <div style="
                height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                text-align:center;
                padding:40px;
                font-size:1.8rem;
                color:white;
                background:linear-gradient(135deg,#ff758c,#ff7eb3);
            ">
                <div>
                    And I'd choose you ; in a every lifetimes , in every world ,
                    in any version of reality , I'd find you and I'd choose you .
                    ❤️
                </div>
            </div>
        `;
    }, 3000); // 3 seconds delay for mini message
}
</script>

</body>
</html>
